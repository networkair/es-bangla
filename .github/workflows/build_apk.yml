name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Audit APK Signing Fingerprint
        run: |
          echo "=========================================="
          echo "  VERIFYING RELEASE APK SIGNING SHA-1"
          echo "=========================================="
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk
          echo "=========================================="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.36
          name: "Es Bangla v1.3.36 (PYQ 2027 Integration, AES-256 Security & UI Refinements)"
          draft: false
          prerelease: false
          body: |
            ### Es Bangla v1.3.36 Release Highlights:
            - **Semester 3 PYQ (Previous Year Questions) Integration**:
              - 11 Official Subject Question Papers for Class 12 Semester 3.
              - Streamlined for 2027 access with Coming Soon prompts for other years.
              - High-resolution thumbnails and ultra-compact PDFs (~2.2 MB total).
            - **Enterprise-Grade AES-256 PDF Security**:
              - Protected with military-grade 256-bit AES (AESv3 / R=6) encryption.
              - Cryptographic 31-character user passphrase & 48-character owner lock.
              - Dynamic in-memory bitwise XOR obfuscation in SecurityManager to prevent binary reverse-engineering.
              - Completely blocks external piracy/extraction while providing seamless zero-prompt in-app viewing.
            - **Splash & Launch Optimization**:
              - Android 12+ native splash icon flash eliminated via transparent vector drawable and dynamic exit animation listener.
              - Removed redundant subtitles under the splash animation.
            - **Profile & Support Enhancements**:
              - Added direct 200-word Help & Support screen connecting to Telegram/Cloudflare reporting API.
              - Cleaned up Profile by removing redundant Plan and Dark Theme toggles.
            - **Navigation & Analytics Polish**:
              - Smooth page transitions with stationary anchored underlying screens.
              - Redesigned Mock Analytics timeframe segment switcher.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
