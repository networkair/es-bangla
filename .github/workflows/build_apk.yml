name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Audit APK Signing Fingerprint
        run: |
          echo "=========================================="
          echo "  VERIFYING RELEASE APK SIGNING SHA-1"
          echo "=========================================="
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk
          echo "=========================================="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.52
          name: "Es Bangla v1.3.52 (Comprehensive Home Screen Scroll Lag & Performance Optimization)"
          draft: false
          prerelease: false
          body: |
            ### Es Bangla v1.3.52 Release Highlights:
            - **Comprehensive Home Screen Scroll Lag Elimination (Silky Smooth 60/120 FPS)**:
              - **Asset Image Optimization**: Resized and compressed all 13 oversized asset icons using Lanczos resampling (down to 256x256 max), reducing asset memory footprint from >25MB to <1MB uncompressed GPU texture memory.
              - **Memory Image Caching (`cacheWidth` / `cacheHeight`)**: Hardened every `Image.asset` on the Home Screen with explicit cache dimensions so the engine does not decode high-resolution bitmaps into the main frame buffer.
              - **Single-Pass Hardware GPU Shadow**: Replaced expensive 4-pass Gaussian blur shadows (which previously forced up to 24 blur passes per frame) with a single hardware-accelerated soft drop shadow.
              - **Independent `RepaintBoundary` Decoupling**: Isolated every card and section (Quick Actions, Semesters, PYQ, Store, Social Media, News Slider) in its own repaint layer to prevent cascades during scroll.
              - **Gesture & Physics Harmony**: Switched nested horizontal News Slider to `PageScrollPhysics(parent: ClampingScrollPhysics())` to eliminate diagonal scroll fights with the vertical `BouncingScrollPhysics`.
              - **Clean Anti-Aliasing**: Eliminated redundant nested `ClipRRect` wrappers by using container `clipBehavior: Clip.antiAlias`.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
