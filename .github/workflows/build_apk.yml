name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.2
          name: "Es Bangla v1.2.2 (Real-Time Push Notifications & Live RTDB Sync)"
          body: |
            ### Es Bangla v1.2.2 Release Highlights:
            - **100% Reliable Real-Time Notifications**:
              - Dual-Sync architecture listening directly to Firebase Realtime Database & Firestore with 4-second instant poller.
              - High-priority Android heads-up system notifications (sound, vibration & banner) delivered directly to user phone.
              - Persistent seen notification tracking to eliminate duplicate chimes.
              - Live Notification Inbox with pull-to-refresh and Shimmer skeleton loading.
              - Fixed Android notification channel ID mapping (`es_bangla_announcements`).
            - **Modern 3D Home Screen Redesign**:
              - Full-width, cohesive 3D feature cards for Semester 3, Semester 4, Previous Year Questions, and Book Notes.
              - 16:9 bright banner news slider with live status indicator and smooth 16px corner rounding.
              - Interactive Academic Semester Selector Pill (`CLASS 12 (Semester 3/4)`) for seamless semester switching.
              - Dedicated Study Reminder 3D Banner in warm amber tone.
              - WhatsApp Hero Community Card with instant "JOIN NOW" pill button.
              - Balanced dual-card social channels hub (YouTube, Telegram, Facebook) and student trust verification badge.
            - **High-Performance Shimmer Loading Animations**:
              - Lightweight, GPU-accelerated shimmer skeleton loaders across News Slider, Mock Test Subject Select, Topics/Sets, and Quiz screens.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
