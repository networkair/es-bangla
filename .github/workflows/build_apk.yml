name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.7
          name: "Es Bangla v1.2.7 (White Notch Cutout, Vintage Colorize Font, Device-Local Notifications & Dark Theme)"
          body: |
            ### Es Bangla v1.2.7 Release Highlights:
            - **Seamless White Notch & Cutout Integration**:
              - Configured `shortEdges` display cutout mode and pure white background across Android native window and decorView.
              - Completely removed black letterbox bars around camera notches.
            - **Typography & Clean Header**:
              - Registered and applied custom TrueType font `Vintage Colorize` for `Es Bangla` brand title.
              - Removed welcome subtitle and cleared cluttered tags.
            - **Clean News Experience**:
              - Removed `LATEST NEWS` and `LIVE` tag overlays from 16:9 news banners and modals in the user panel.
            - **Enhanced Device-Local Push Notifications**:
              - Background FCM handler wakes up status bar notification and saves directly to local storage even when app is killed/closed.
              - Android native `NotificationAlarmReceiver` with `AlarmManager` syncs notifications in background.
              - Notification Inbox operates 100% on device local storage without remote database dependency, with offline support and clear-all action.
            - **Dynamic Dark Theme**:
              - Added Dark Theme toggle in Profile Preferences with persistent storage and system theme reactivity.
            - **Renamed Premium Store**:
              - Action tile updated to `PREMIUM STORE`.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
