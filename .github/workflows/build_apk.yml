name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Audit APK Signing Fingerprint
        run: |
          echo "=========================================="
          echo "  VERIFYING RELEASE APK SIGNING SHA-1"
          echo "=========================================="
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk
          echo "=========================================="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.11
          name: "Es Bangla v1.3.11 (Refined Analytics Chart, Unfrozen Button & Es Bangla Strategy)"
          body: |
            ### Es Bangla v1.3.11 Release Highlights:
            - **Graph Section Redesign & 100% Text Overflow Fix**:
              - Removed permanent tooltip indicator that was overflowing out of chart boundaries.
              - Integrated dedicated `topTitles` percentage indicators with dynamic color matching (Green/Amber/Red).
              - Added smooth background capacity track (`backDrawRodData`) up to 100%.
              - Added mini performance legend (`≥70% High`, `50-69% Avg`, `<50% Focus`).
              - Tooltips on touch now strictly fit within boundaries (`fitInsideVertically: true`).
            - **Start Mock Test Button Fix**:
              - Removed frozen floating overlay that was blocking chart and step cards during scroll.
              - Button now scrolls naturally at the bottom of the screen.
            - **Es Bangla Custom Strategy Steps**:
              - Replaced all reference image texts with custom Es Bangla features and study strategy.
              - Refined Subject Performance Detail Screen metrics and layout.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
