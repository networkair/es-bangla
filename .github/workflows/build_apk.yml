name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.2
          name: "Es Bangla v1.3.2 (3D News Carousel, Dynamic Quiz Feedback, Font & Refined Shadows)"
          body: |
            ### Es Bangla v1.3.2 Release Highlights:
            - **Modern Peeking News Carousel**:
              - 3D Peeking Carousel with centered active cards (`viewportFraction: 0.86`, `borderRadius: 18`) and smooth 3D scale animation (0.93 - 1.0).
              - Centered Golden Amber indicator dots (`#F59E0B`) with subtle glow.
              - Infinite smooth 4s auto-scrolling with ease-in-out cubic curve.
              - Branded Es Bangla fallback slides with luxury gradients.
            - **Refined Home Screen Card Shadows**:
              - Tuned shadow elevation and blur (`offset: Offset(0, 3)`, `blurRadius: 8`, zero spread) across all cards to eliminate dark shadow bleeding onto neighboring cards.
              - Increased card separation to 14dp with crisp 1px borders.
            - **Video Player Enhancements**:
              - Disabled copy link button (neutralized DOM, CSS, JS event capture, and native touch guard).
              - Redesigned white circular back button for seamless portrait and fullscreen navigation.
            - **Advanced Quiz Taking Experience**:
              - Top-aligned segmented progress capsules with dynamic color feedback: Correct (Green `#10B981`), Incorrect (Red `#EF4444`), Active (Blue `#2563EB`).
              - 3D question and option cards with 14dp vertical separation.
              - Removed explanation during quiz (shown on completion / result screen).
            - **Global Bengali Typography**:
              - Integrated official Google Font 'Noto Serif Bengali' across light and dark themes.
            - **Mock Test UI**:
              - Added Golden Rupee Coin icon (`ic_coin.png`) beside 'Full Free' badge.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
