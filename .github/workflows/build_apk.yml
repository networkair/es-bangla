name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.5
          name: "Es Bangla v1.3.5 (Full Mockup Visual Redesign, 3D Icons, Soft Organic Blobs & Cream Canvas)"
          body: |
            ### Es Bangla v1.3.5 Release Highlights:
            - **Exact Fidelity Implementation of User Reference Mockup**:
              - **New 3D Icons**: Integrated 3D glowing lightbulb on stacked books for Semester 3 & 4, 3D clipboard with magnifying glass for PYQ, and 3D Store building with shopping cart for Premium Store.
              - **Organic Card Backdrop Blobs**: Added soft organic sky, peach, teal, and rose blobs behind the large 3D icons and bottom-right corners.
              - **Accent Underline Bars**: Distinct rounded accent bars beneath card titles (Sky Blue for Sem 3, Amber for Sem 4, Teal for PYQ, Coral Pink for Store).
              - **Refined Study Reminder Pill**: Royal/electric blue gradient with organic cyan bubble, white badge with golden bell, and right chevron pill.
              - **Royal Blue News Slider Dots**: Replaced amber dots with circular Royal Blue indicator dots (`#0070F3`).
              - **Dual-Color "Es Bangla" AppBar Title**: Navy "Es", Royal Blue "Bangla", and golden brushstroke accent underline.
              - **Warm Cream Canvas Background**: `#FAF8F5` background for rich, warm aesthetic contrast with crisp white cards.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
