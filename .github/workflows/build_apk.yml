name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Audit APK Signing Fingerprint
        run: |
          echo "=========================================="
          echo "  VERIFYING RELEASE APK SIGNING SHA-1"
          echo "=========================================="
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk
          echo "=========================================="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.12
          name: "Es Bangla v1.3.12 (99% Common Badges, Seamless Guest Mode, Cloud Entitlements & Official Icons)"
          body: |
            ### Es Bangla v1.3.12 Release Highlights:
            - **Semester 3 & 4 '99% Common' Badges**:
              - Added clean, vibrant `⚡ 99% Common` pill badges to Semester 3 and 4 cards on both Home and Video Library screens.
              - Polished 3D card layout without clutter, with borderless 3D shadows.
            - **Seamless Guest Exploration & Smart Auth Gates**:
              - Guests can explore the app and take free mock tests without forced registration.
              - Prompts login when watching video library classes, redeeming course codes, or accessing premium mock tests.
              - Direct post-login access re-evaluation so users immediately proceed without double-tapping.
            - **Cloud Firestore Entitlement Sync & Persistence**:
              - Auto-syncs subscription and mock test unlocks across `users/{uid}`, `users/{uid}/entitlements`, and `access_keys`.
              - Subscriptions persist permanently even if the user clears app storage or logs out/in.
              - Restoring user's own previously used invite key is fully supported without errors.
            - **3D Profile Screen & Official Assets**:
              - Integrated official assets: Google 'G' icon, Saved Question Vault (`ic_saved_vault.jpg`), Subscription Status (`ic_subscription_status.jpg`), Activity & Streak (`ic_calendar_streak.jpg`), and Mock Analytics (`ic_mock_chart.jpg`).
              - Added Guest Banner with fast Google Sign-In and responsive login/logout state switching.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
