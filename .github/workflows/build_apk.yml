name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Audit APK Signing Fingerprint
        run: |
          echo "=========================================="
          echo "  VERIFYING RELEASE APK SIGNING SHA-1"
          echo "=========================================="
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk
          echo "=========================================="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.19
          name: "Es Bangla v1.3.19 (Direct VIP WhatsApp Activation & Pure Cloud Authority)"
          draft: false
          prerelease: false
          body: |
            ### Es Bangla v1.3.19 Release Highlights:
            - **Direct VIP Subscription via WhatsApp**:
              - Removed invite and access code inputs completely.
              - Students contact directly on WhatsApp with pre-filled UID, Email, and Name.
              - Admins activate subscriptions directly in the Admin Panel with customizable durations (365d, 180d, 90d, 30d, custom).
            - **Instant Cloud Sync & Auto-Unlock**:
              - Real-time Firestore streams detect activation immediately and unlock test sets and videos.
            - **Strict Free vs Premium Isolation**:
              - Only Set 1 is free in Free Mode; all subsequent sets and Premium Mode require active VIP status.
            - **Profile Plan Recognition**:
              - Reactive plan badges (Combo VIP, Mock Test VIP, Video VIP, Free Plan) with pure server priority.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
