name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Audit APK Signing Fingerprint
        run: |
          echo "=========================================="
          echo "  VERIFYING RELEASE APK SIGNING SHA-1"
          echo "=========================================="
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk
          echo "=========================================="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.32
          name: "Es Bangla v1.3.32 (Safollo Analytics Chart & Tactile Home Cards Overhaul)"
          draft: false
          prerelease: false
          body: |
            ### Es Bangla v1.3.32 Release Highlights:
            - **Safollo-Grade Advanced Mock Test Analytics Chart**:
              - Researched Safollo APK (`com.aspd.suggestionforclass10`) & MPAndroidChart.
              - Replaced horizontal label collision with a horizontally scrollable bouncing canvas with minimum 74px column width.
              - Sticky left Y-axis scale (0% to 100%) with dashed grid lines.
              - Mutually exclusive subject categorization (>=70% Mastered, <70% Revision Needed) eliminating conflicting percentages.
              - Interactive MarkerView card on bar tap showing attempts, score, and link to chapter analytics.
            - **Safollo-Grade Tactile Home Cards & Elevation Shadow Overhaul**:
              - Applied Safollo's 3-stop micro-gradient (`#FFFFFF` -> `#FCFCFC` -> `#F7F8FA`) giving physical depth.
              - Crisp 1px micro-border stroke (`#E2E8F0`) defining clean edges.
              - Dual-layer spot and ambient elevation shadow with negative spread (`spreadRadius: -2`) hugging the bottom edge.
              - Exact 22dp card corner radius matching Safollo's native specification.
              - Pill-shaped `99% Common` badge (`BorderRadius.circular(20)`).
              - Refreshing cool pearl white canvas background (`#F8FAFC`).
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
