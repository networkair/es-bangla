name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Audit APK Signing Fingerprint
        run: |
          echo "=========================================="
          echo "  VERIFYING RELEASE APK SIGNING SHA-1"
          echo "=========================================="
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk
          echo "=========================================="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.31
          name: "Es Bangla v1.3.31 (Design Overhaul: Home, Subject Select & Quiz Mockup)"
          draft: false
          prerelease: false
          body: |
            ### Es Bangla v1.3.31 Release Highlights:
            - **HomeScreen Redesign Matching Mockup**:
              - Pure white cards with 24px border radius, subtle border, and soft drop shadow.
              - Brand header with vertical divider and golden brush accent under "Es Bangla".
              - Updated 3D icons for PYQ, Semester 3, Semester 4, and Store.
            - **Subject Selection Screens Redesign**:
              - Warm ivory background tone (`#FCF8F4`) across Free Mock Test, Premium Mock Test, and Semester Notes.
              - "Choose Subject" title with golden accent underline.
              - Centered 3D subject graphics with bottom label and circular double-arrow button.
              - Canonical subject ordering (বাংলা, English, রাষ্ট্রবিজ্ঞান, শিক্ষাবিজ্ঞান, ইতিহাস, দর্শন, সংস্কৃত, ভূগোল, কম্পিউটার).
            - **Quiz Screen Complete Mockup Realization**:
              - Warm ivory background with top header featuring rounded square back button and vertical divider.
              - Blue pill question counter badge (`Question 1 of 10`).
              - Segmented capsule progress bar ("কাটা কাটা লোডিং বার") with dynamic feedback colors.
              - Pure white question card featuring a golden-yellow accent underline bar (`#F59E0B`).
              - Option cards with circular letter badges (A, B, C, D) and instant buzzer sound effects.
              - Next Question button with muted slate resting state and royal blue active state.
              - Report Question action directly below the Next button.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
