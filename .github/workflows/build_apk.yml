name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.8
          name: "Es Bangla v1.1.8 (Modern Mock Test, Native Audio Buzzers, Result Lottie Animation)"
          body: |
            ### Es Bangla v1.1.8 Release Highlights:
            - **Modern Mock Test UI**: Redesigned Subject Selection and Topic & Set selection screens with horizontal scrolling cards.
            - **Minimalist Clean Quiz Screen**: Only sleek back button at header, animated smooth progress bar, question slide & fade transition.
            - **Native Zero-Latency Buzzers**: Native Android MediaPlayer integration for instant correct & incorrect buzzer audio.
            - **Controlled Next Button**: Disabled until an option is selected.
            - **Real-Time Firestore Question Reports**: Auto-attached question preview box and direct submission to Firebase Firestore `question_reports`.
            - **Redesigned Result Screen**: Prominent Lottie success animation at the top, zero negative marking, clean English metrics (Total Questions, Correct, Incorrect), and premium question review cards.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
