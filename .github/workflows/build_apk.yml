name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Audit APK Signing Fingerprint
        run: |
          echo "=========================================="
          echo "  VERIFYING RELEASE APK SIGNING SHA-1"
          echo "=========================================="
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk
          echo "=========================================="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.51
          name: "Es Bangla v1.3.51 (Refined News Slider with Thin Black Border & Ultra-Smooth Scroll Optimization)"
          draft: false
          prerelease: false
          body: |
            ### Es Bangla v1.3.51 Release Highlights:
            - **Refined News Slider with Thin Black Border Stroke**:
              - Added a crisp, thin black border outline (`Border.all(width: 1.0)`) around the news slider banner card.
              - Standardized card container with rounded corners (`16px`), matching horizontal margins (`16px`), soft elevation shadow, and anti-aliased clipping.
            - **Eliminated Home Screen Scrolling Lag / Jank (Ultra-Smooth 60/120 FPS)**:
              - Isolated the news slider into a dedicated `_HomeNewsSlider` component with independent state management.
              - Replaced whole-screen `setState` on slide swipe/auto-advance with an isolated `ValueNotifier<int>` updating only the indicator dots.
              - Stream subscription is memoized in `initState` rather than re-instantiated during build.
              - Auto-scroll timer synchronization decoupled from post-frame build churn.
              - Capped `CachedNetworkImage` memory footprint (`memCacheWidth: 800`) to prevent high-res bitmap decoding freezes on Android.
              - Added `RepaintBoundary` for zero-lag silky smooth scrolling.
            - **Polished Card Visual Details**:
              - Enhanced category tag badges with amber accent and drop glow.
              - Refined Bengali typography, contrast, and subtle interactive action chips.
              - Smoothly animated Royal Blue (`#0070F3`) pill indicator dots.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
