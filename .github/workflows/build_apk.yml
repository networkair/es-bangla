name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release & Split ABI)
        run: |
          echo "Building Optimized Split-per-ABI APKs..."
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
          echo "Building Universal Release APK..."
          flutter build apk --release --android-skip-build-dependency-validation
          ls -lh build/app/outputs/flutter-apk/

      - name: Audit APK Signing Fingerprint
        run: |
          echo "=========================================="
          echo "  VERIFYING RELEASE APK SIGNING SHA-1"
          echo "=========================================="
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk
          echo "=========================================="

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EsBangla-Flutter-APKs
          path: build/app/outputs/flutter-apk/*.apk

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' ')
          BUILD_NUM=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f2 | tr -d ' ')
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "build_num=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "App Version: v$VERSION (Build $BUILD_NUM)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.version }}
          name: "Es Bangla ${{ steps.app_version.outputs.version }} (Final Release: Optimized 60FPS & High Performance)"
          draft: false
          prerelease: false
          body: |
            ### Es Bangla ${{ steps.app_version.outputs.version }} Final Release Highlights:
            - **Optimized ARM64 High-Performance Build (`app-arm64-v8a-release.apk`)**:
              - Targeted specifically for 64-bit Android smartphones.
              - Cut APK download size in half (~50-60 MB) with instant cold boot and butter-smooth 60/120 FPS animations.
            - **Universal Compatibility Build (`app-release.apk`)**:
              - Complete multi-architecture universal package supporting all 32-bit and 64-bit devices.
            - **Offline-First Encrypted Mock Test Bundles**:
              - All 1,126 mock test sets across 9 subjects (over 11,260 questions & answers) securely bundled and encrypted.
              - Instant 0ms question paper loading, zero loading spinners.
            - **Background Silent OTA Cloud Sync**:
              - Real-time cloud sync for question updates, notices, and test solutions.
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
