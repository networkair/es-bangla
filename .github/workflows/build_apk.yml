name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Audit APK Signing Fingerprint
        run: |
          echo "=========================================="
          echo "  VERIFYING RELEASE APK SIGNING SHA-1"
          echo "=========================================="
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk
          echo "=========================================="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.10
          name: "Es Bangla v1.3.10 (Mock Analytics Redesign from Mockups & Clean Reminder Tile)"
          body: |
            ### Es Bangla v1.3.10 Release Highlights:
            - **Home Screen Reminder Tile Clean-Up**:
              - Removed the right arrow/chevron circle icon on the Study Reminder card for an unobstructed, balanced layout.
            - **Mock Test Analytics Complete Redesign (Matching Exact Mockup Reference)**:
              - Added clean pill-segmented timeframe filter (`Daily` | `Weekly` | `Monthly`).
              - `Total Solved Questions` section with horizontal cards by subject (green book icon, count, 'Questions').
              - `Your Strength Topics` section (>=70% accuracy) with green wave sparklines, plus authentic clipboard-empty-state when no strength topics yet.
              - `Your Weak Topics` section with rose-tinted cards, percentage, and red wave sparklines.
              - `Overall Performance` responsive BarChart with subject X-axis and dynamic color coding.
              - `How to Improve Your Performance` horizontal swipeable step cards (Step 1 to Step 6).
              - **Subject Performance Detail Screen**:
                - Tapping any subject opens dedicated performance breakdown with 2x2 metric cards (`Overall Performance`, `Average Percentage`, `Total Test Attempted`, `Correct Questions`).
                - Displays `Best Chapters` and `Weak Chapters` with overall score pill.
                - Quick-action `🚀 Start New Mock Test` button.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
