name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.4
          name: "Es Bangla v1.2.4 (Consistent Permanent Signing & Refined 3D Home)"
          body: |
            ### Es Bangla v1.2.4 Release Highlights:
            - **Consistent Permanent Release Signing**:
              - Permanent release keystore configured to prevent Android package installer signature mismatch errors ("App not installed as package appears to be invalid").
              - Seamless future updates without needing to uninstall.
            - **Refined Authentic 3D Home Screen**:
              - Restored authentic Es Bangla design layout (removed reference-app clones).
              - Removed top Class/Semester pill selector from HomeScreen (kept exclusively in Profile section).
              - 16:9 Hero News Slider with flush edge-to-edge fit, sharp 90-degree corners, and crystal-clear image presentation.
              - Side-by-side Semester 3 and Semester 4 3D feature cards.
              - Pure white 3D cards with subtle soft drop shadows across all sections.
              - Warm soft-amber Study Reminder card matching the white theme.
              - Uniform light blue (Blue Fairy) rounded icon containers with crisp, prominent icons.
              - Clean black typography for titles and headings; removed cluttered tags/badges.
              - Authentic 4-channel Social Media Hub (YouTube, Facebook, Telegram, WhatsApp).
            - **BigPicture Notification Previews**:
              - Android status bar notifications now display rich image thumbnail and full expandable BigPicture previews.
              - Fixed duplicate notification rings and automated chimes.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
