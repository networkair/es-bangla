name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Audit APK Signing Fingerprint
        run: |
          echo "=========================================="
          echo "  VERIFYING RELEASE APK SIGNING SHA-1"
          echo "=========================================="
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk
          echo "=========================================="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.49
          name: "Es Bangla v1.3.49 (Highlighted WhatsApp VIP Card, Official Social Links & Card Outlines Removed)"
          draft: false
          prerelease: false
          body: |
            ### Es Bangla v1.3.49 Release Highlights:
            - **Highlighted Official WhatsApp Community Card**:
              - Prominent featured horizontal card with emerald green styling, 'OFFICIAL' badge, and green 'যুক্ত হন' button.
              - Connected directly to the official WhatsApp Channel (`https://whatsapp.com/channel/0029VbDzZ5105MUnpKlW3C3r`).
            - **Refined Official Social Channels**:
              - Clean side-by-side layout for YouTube (`https://youtube.com/@esbanglayt?si=4UbAYWoKCgKRj6JJ`) and Telegram (`https://t.me/EsBanglaofficial`).
              - Instagram completely removed as requested.
              - Clean, minimal cards without subtitles or clutter.
            - **New 3D Icons**:
              - Semester 3 & Semester 4: Upgraded with new 3D open book icon on circular background.
              - Previous Years Questions (PYQ): Upgraded with new hand holding pencil exam writing icon.
            - **Cleaner Card Aesthetics**:
              - Removed border outlines from Semester 3, Semester 4, PYQ, and Premium Store cards while keeping the luxurious bottom drop elevation shadow.
              - Removed right chevron arrow buttons from Semester 3, Semester 4, PYQ, and Premium Store cards (kept only on Study Reminder and Notepad).
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
