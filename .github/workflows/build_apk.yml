name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "Es Bangla v1.3.0 (Clean Topics Screen, Fixed 3D Trust Banner & Safollo-Style Video Player)"
          body: |
            ### Es Bangla v1.3.0 Release Highlights:
            - **Clean Minimalist Topics Screen**:
              - Clean header bar with circular back button only (removed title, subtitle, search).
              - Removed hero banner ("BANGLA ভিডিও লেকচার").
              - 3D topic cards with dual soft shadows, rounded borders, 3D FREE/LOCKED badges, and 3D play buttons.
            - **Fixed 3D Trust Banner**:
              - Docked community trust banner to the bottom of the screen with 3D styling and border.
            - **Safollo-Style Clean Video Player**:
              - Removed top title and Secure badge; removed all bottom clutter cards and text.
              - Pure white background matching app theme.
              - Prominent 270dp player layout.
              - Custom bottom-left white back button (`<`) to return to topics.
              - Custom bottom-right royal blue fullscreen button (`[ ↗ ]`) to toggle fullscreen.
              - Bulletproof touch guard covering the bottom bar (blocking YouTube logo and recommendations).
              - Neutralized channel header clicks.
              - Fixed sound toggle (mute/unmute works smoothly).
              - Blocked Settings "More" options and completely eliminated "More Videos" suggestions.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
