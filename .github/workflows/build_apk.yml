name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.6
          name: "Es Bangla v1.2.6 (True Fullscreen, Deep 3D Shadows, Large Icons & Header Refinements)"
          body: |
            ### Es Bangla v1.2.6 Release Highlights:
            - **True Fullscreen App (Immersive Sticky Mode)**:
              - Removed Android top system status bar (clock, battery, timer, notifications).
              - Native Fullscreen configured across Android manifest, styles.xml, MainActivity.kt, and Flutter main.dart.
              - App fills 100% of the physical screen display.
            - **Enhanced 3D Bottom Shadows**:
              - Prominent grounded bottom drop shadows on all full-width long cards (Study Reminder, PYQ, Book Notes, Social Hub).
            - **Large Edge-to-Edge Semester 3 & 4 Icons**:
              - Cropped 58% transparent margin from Semester 3 and 4 3D icons, scaling them to fill the light blue circular containers.
            - **Header Refinement**:
              - Pure black bold brand title `Es Bangla`.
              - Small, clean English subtitle `Welcome, $userName 👋` with all Bengali text removed.
            - **Reliable Offline Detection**:
              - Eliminated false offline screens on app resume by removing background HTTP timer and adding lifecycle sync with hardware connectivity.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
