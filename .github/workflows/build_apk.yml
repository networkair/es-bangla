name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Audit APK Signing Fingerprint
        run: |
          echo "=========================================="
          echo "  VERIFYING RELEASE APK SIGNING SHA-1"
          echo "=========================================="
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk
          echo "=========================================="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.46
          name: "Es Bangla v1.3.46 (16:9 Flush News Slider + Study Notepad & Reminder Row + Optimized Card Spacing)"
          draft: false
          prerelease: false
          body: |
            ### Es Bangla v1.3.46 Release Highlights:
            - **16:9 Flush Edge-to-Edge News Slider**:
              - Updated News Slider to exact 16:9 widescreen ratio (`width * 9 / 16`) for perfect banner display without clipping.
              - Straight square corners (`borderRadius: BorderRadius.zero`) flush with app edges for an edge-to-edge cinematic banner feel.
            - **Side-by-Side Quick Action Cards (Notepad + Study Reminder)**:
              - Added brand-new **STUDY NOTEPAD** feature alongside **SET STUDY REMINDER** in a compact, balanced side-by-side row.
              - Designed with comfortable, standard alternative pastel colors (soft slate cool for Notepad, soft warm honey for Reminder).
              - Full-featured persistent offline Study Notepad with notes search, color tags, editing, timestamps, and note cards.
            - **Optimized Vertical Card Spacing**:
              - Significantly reduced the excess gap below the Study Reminder / Notepad row (12px).
              - Reduced spacing between all subsequent cards (Semester 3, Semester 4, PYQ, Store, Social) to 13px for a sleek, cohesive look.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
