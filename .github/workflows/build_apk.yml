name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.7
          name: "Es Bangla v1.3.7 (English 3D Login Screen, Google Sign-In, Subject Mastery & Activity Streak)"
          body: |
            ### Es Bangla v1.3.7 Release Highlights:
            - **Redesigned English Login Screen & Google Sign-In**:
              - Clean English UI with borderless 3D card and reminder royal blue gradient button.
              - Full Google Sign-In integration with official SHA-1/SHA-256 fingerprint linking.
              - Smooth animated transitions between Login and Sign Up.
            - **Dedicated Mock Test Analytics & Activity Streak Separation**:
              - Mock Test Analytics focused on pure Subject Mastery (Horizontal sliders for Solved Questions, Weak Topics, Strength Topics, BarChart comparison, and Targeted Steps).
              - Standalone Activity & Streak screen with consistency metrics and interactive monthly study calendar.
              - Streamlined profile action tiles without redundant subtitles.
            - **Notification & Reliability Improvements**:
              - Discarding test/dummy push notifications from cluttering device notifications.
              - Instant app startup with asynchronous background service initialization.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
