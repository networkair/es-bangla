name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Audit APK Signing Fingerprint
        run: |
          echo "=========================================="
          echo "  VERIFYING RELEASE APK SIGNING SHA-1"
          echo "=========================================="
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk
          echo "=========================================="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.47
          name: "Es Bangla v1.3.47 (New 3D Icons & Elevated Social Media Hub Redesign)"
          draft: false
          prerelease: false
          body: |
            ### Es Bangla v1.3.47 Release Highlights:
            - **Brand-New 3D Icons with Transparent Cutouts**:
              - Applied crisp 3D spiral notepad with pencil icon for **STUDY NOTEPAD**.
              - Applied crisp 3D checklist & target bullseye icon for **SET STUDY REMINDER**.
              - Applied clean 3D stacked hardcover books icon for **SEMESTER 3** & **SEMESTER 4** cards.
              - Applied high-resolution transparent cutouts for **WhatsApp**, **Instagram**, **YouTube**, and **Telegram**.
            - **Elevated Social Media Hub Redesign**:
              - **WhatsApp VIP Community Card**: Soft emerald pastel container with 3D WhatsApp badge and vibrant 'JOIN NOW' button.
              - **Official Channels Row**: Dedicated YouTube (ভিডিও ক্লাস), Telegram (ফ্রি PDF নোটস), and Instagram (টিপস ও রিলস) cards with comfortable pastel backgrounds and direct links.
              - **Student Trust & Security Badge**: Verified blue shield badge with West Bengal student community trust message and 4.9 star rating.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
