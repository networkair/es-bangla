name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.4
          name: "Es Bangla v1.3.4 (Premium 3D Cards, Refined Soft Shadow & Clean Study Reminder)"
          body: |
            ### Es Bangla v1.3.4 Release Highlights:
            - **Premium 3D Card Architecture & Realistic Downward Elevation**:
              - Re-engineered all primary home screen cards (PYQ, Premium Store, Community Hub) to match the reference design.
              - Substantial 28dp rounded geometry with dual-layer soft downward drop shadow (`offset: Offset(0, 8)`, `blurRadius: 16`, `spreadRadius: -2` + `offset: Offset(0, 3)`, `blurRadius: 6`).
              - Elevated 3D circle avatar badge (66x66dp with soft `#EDF4FF` sky-tinted backdrop) and centered forward chevron action pill (42x42dp with `#EAF2FF`).
            - **Refined Study Reminder Pill**:
              - Removed the flame icon on the left while preserving the crisp white circular badge around the reminder clock icon.
              - Added matching 3D elevation downward drop shadow.
            - **Canvas & Surface Color Harmony**:
              - Matched scaffold and app bar with a subtle off-white canvas (`#F8FAFC`), giving crisp `#FFFFFF` cards authentic physical pop and 3D depth without visual clutter.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
