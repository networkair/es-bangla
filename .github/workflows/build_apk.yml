name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Audit APK Signing Fingerprint
        run: |
          echo "=========================================="
          echo "  VERIFYING RELEASE APK SIGNING SHA-1"
          echo "=========================================="
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk
          echo "=========================================="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.50
          name: "Es Bangla v1.3.50 (Class 12 & Semester 3/4 Onboarding Selection, Single-Semester UI Mode & Icon Fix)"
          draft: false
          prerelease: false
          body: |
            ### Es Bangla v1.3.50 Release Highlights:
            - **Class 12 & Semester 3/4 Onboarding & Selection Modal**:
              - Prompts guests and authenticated users upon entering the app to select Class 12 and their active Semester (Semester 3 or Semester 4).
              - Seamlessly remembered in local storage with instant real-time synchronization.
              - Interactive top-bar semester switcher chip allows changing semesters at any time with 1 tap.
            - **Personalized Single-Semester App Experience**:
              - **Home Screen**: Displays only the active semester's card (Semester 3 or Semester 4).
              - **Library Screen**: Displays only the active semester's video classes & subjects.
              - **Mock Test Screen**: Automatically adapts and loads quizzes for the active semester.
              - **Previous Years Questions (PYQ)**: Displays only the active semester card.
            - **Fixed Semester Icon Background**:
              - Completely removed the duplicate outer circular background from the semester book icon, allowing the icon's native circular badge to fit perfectly without double borders.
            - **Frictionless Auth**:
              - Removed class/semester questions from the login/signup form; class and semester are selected inside the app as requested.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
