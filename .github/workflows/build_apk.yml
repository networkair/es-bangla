name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.5
          name: "Es Bangla v1.2.5 (3D Card Shapes, Seamless White Canvas & Compact Design)"
          body: |
            ### Es Bangla v1.2.5 Release Highlights:
            - **Seamless Matching Canvas**:
              - Unified screen background (`#FFFFFF`) and card backgrounds (`#FFFFFF`) to eliminate background/card color mismatch.
            - **Signature 3D Shape & Drop Shadows**:
              - Deep rounded squircle cards (`BorderRadius.circular(28)`) with multi-layered soft drop shadows creating authentic 3D physical elevation.
              - Completely removed card outlines and harsh gray borders.
            - **Compact & Balanced Spacing**:
              - Reduced spacing between cards and sections for a snug, modern, cohesive layout.
            - **Modern 3D Study Reminder**:
              - Smooth pill-shaped card in warm peach-cream (`#FFEEDD`) with bold black title and 3D reminder bell icon.
            - **Large Vibrant Icons & Borderless Circles**:
              - Enlarged 3D icons to fill ~80% of circular containers.
              - Removed all border outlines from light blue icon containers (`#EDF4FF`).
              - Added circular chevron action buttons (`#EAF2FF`) with bold slate arrows.
            - **Clean English Headlines**:
              - Streamlined typography with bold uppercase English titles (`SEMESTER 3`, `SEMESTER 4`, `PREVIOUS YEARS QUESTIONS`, `BOOK NOTES & HANDNOTES`).
              - Removed cluttered Bengali subtitles and redundant badges.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
