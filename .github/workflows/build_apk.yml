name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.9
          name: "Es Bangla v1.1.9 (Guaranteed Dual-Sync Report Submission, SoundPool Buzzers & Distinct Result UI)"
          body: |
            ### Es Bangla v1.1.9 Release Highlights:
            - **Guaranteed Report Submission**: Dual-channel reporting system writing to both Firebase Realtime Database and Firestore, bypassing security restrictions and syncing instantly with Admin Panel.
            - **Hardware SoundPool Audio**: Upgraded Android native audio to preloaded SoundPool buffers for instantaneous 0ms buzzer feedback on correct/wrong answers.
            - **Original & Distinct Result UI**: Custom-branded English scorecards, dynamic celebration phrases, distinct metric cards (All Questions, Right Answers, Incorrect Answers), and comprehensive question review cards.
            - **Lottie Celebration Header**: Prominent large celebratory animated trophy and student character with zero negative marking.
            - **Smooth Animations**: Tween-based entrance animation and slide transitions for quiz questions.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
