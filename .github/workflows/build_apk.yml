name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.9
          name: "Es Bangla v1.2.9 (Library Top Banner, 3D Color-Matched Semester Cards & Icons)"
          body: |
            ### Es Bangla v1.2.9 Release Highlights:
            - **Top Video Library Banner Integration**:
              - Fitted the high-resolution 16:9 banner illustration with rounded corners, subtle border, and 3D shadow.
            - **Semester 3 3D Card Color Matching**:
              - Background gradient softly matched to the ice-blue 3D book icon (`#F8FCFE` to `#EAF5FC`).
              - Fitted the transparent background 3D stacked book icon on the right side.
            - **Semester 4 3D Card Color Matching**:
              - Background gradient matched to the warm peach/amber 3D book & graduation cap icon (`#FFFDF9` to `#FFF3E6`).
              - Orange/peach `Class 12` pill badge and fitted transparent 3D icon.
            - **Seamless 3D Visual Depth**:
              - Refined dual-layer drop shadows and responsive proportions.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
