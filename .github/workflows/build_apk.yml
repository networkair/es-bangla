name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.6
          name: "Es Bangla v1.3.6 (Avatar Selection System, Mock Test Arrow Fix, Clean Analytics & Saved Vault UI)"
          body: |
            ### Es Bangla v1.3.6 Release Highlights:
            - **Profile Avatar Customization System**:
              - Added interactive '+' badge to user profile picture.
              - Bottom-sheet avatar picker featuring 10 custom illustrated character avatars with smooth selection, reset option, and persistent local storage.
            - **Mock Test Arrow Fix**:
              - Fixed overflowing action button arrow on premium mock test cards on narrow screens.
            - **Decluttered Analytics & Saved Question UI**:
              - Streamlined Performance Analytics by removing verbose subtitles and extra descriptions from section headers, subject cards, focus areas, strength topics, and improvement steps.
              - Polished Saved Question Vault by removing the redundant overview banner and title for an ultra-clean, subject-focused view.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
