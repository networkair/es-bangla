name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "Es Bangla v1.2.0 (Subject-Grouped Vault, Advanced 3D Analytics & Profile Upgrade)"
          body: |
            ### Es Bangla v1.2.0 Release Highlights:
            - **Subject-Grouped Saved Questions**: Questions saved during mock tests are categorized strictly by subject with colorful 3D subject cards, question counts, correct answer solutions, and contextual explanations.
            - **Advanced Mock Analytics Dashboard**:
              - *Subject Mastery*: Multi-timeframe performance breakdown (All Time, 30 Days, 7 Days), 3D metric cards, Subject Comparison Bar Chart, Priority Focus Areas (<60% accuracy), Mastery Strengths (>=70%), and targeted 4-step improvement roadmaps.
              - *Subject Deep-Dive Screen*: Detailed metrics (Proficiency, Accuracy, Total Attempts, Correct Solved) with high-performing and focus-needed chapter cards.
              - *Activity & Streak*: Dedicated monthly calendar tracking mock test completion days in 3D emerald pills with streak count.
            - **100% English Experience in Profile & Analytics**: Complete translation and terminology upgrade across Profile, Analytics, and Saved Questions.
            - **Word Count Limit in Reporting**: Observation/feedback messages in the reporting bottom sheet are now capped at 100 words with live counter feedback ($words / 100 words).
            - **Guaranteed Dual-Sync Reporting**: Real-time dual submission to both Firebase Realtime Database and Firestore, synced directly with the web Admin Panel.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
