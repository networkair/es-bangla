name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Es Bangla APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Setup Permanent Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias esbangla -keyalg RSA -keysize 2048 -validity 10000 -storepass esbangla123 -keypass esbangla123 -dname "CN=EsBangla, OU=Education, O=EsBangla, L=Kolkata, ST=WB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore(signing): commit permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.3
          name: "Es Bangla v1.3.3 (New Library Banner, Pure Bottom Shadows & Vibrant Study Reminder)"
          body: |
            ### Es Bangla v1.3.3 Release Highlights:
            - **New Library Section Top Banner**:
              - Replaced top banner with high-resolution custom artwork (1672x941) "শিখুন, দেখুন নিজেকে এগিয়ে নিন - সমস্ত বিষয়ের শিক্ষামূলক ভিডিও এক জায়গায়".
              - Refined elevation and rounded container for perfect edge-to-edge fit.
            - **Pure Directional Bottom Shadows for All Home Cards**:
              - Refined shadows on long cards (PYQ, Premium Store, Community Hub) and Semester cards using negative spread radius (`spreadRadius: -2`, `offset: Offset(0, 4)`).
              - Completely eliminated top/side bleeding and shadow overlap onto neighboring cards.
              - Increased card separation to 16dp for clean, comfortable spacing.
            - **Vibrant & Comfortable Study Reminder Card**:
              - Redesigned with a rich Sapphire Blue gradient, golden active notification bell, and crisp white typography.
              - Completely eliminated pale washed-out look for maximum visual comfort and contrast.
            - **Clean Professional Messaging**:
              - Removed all internal technical mentions (e.g. Firebase Firestore, admin, API) from empty states and dialogs.
              - Replaced with friendly, positive user messages ("শীঘ্রই নতুন ভিডিও ও ক্লাস যুক্ত করা হবে").
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
